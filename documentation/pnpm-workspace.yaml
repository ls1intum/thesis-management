allowBuilds:
  '@swc/core': true
  core-js: true

# Pin transitive dependency versions to eliminate vulnerable copies pulled in
# by Docusaurus and its plugins.
overrides:
  # GHSA-qj8w-gfj5-8c6v (RCE) + serialize-javascript CPU exhaustion
  serialize-javascript@<7.0.5: 7.1.4
  # GHSA-5jgf-p345-68v8 / GHSA-fph4-wmhf-6fwf / GHSA-f65p-4m7j-42xc / GHSA-jqff-g426-hqxp
  # (fast-uri host confusion + SSRF, on top of GHSA-7p8r-x3mc-p8w7 / GHSA-v2hh-gcrm-f6hx, via ajv)
  fast-uri@<3.1.6: 4.2.3
  # GHSA (uuid missing buffer bounds check in v3/v5/v6)
  uuid@<11.1.1: 14.0.3
  # GHSA-2v37-7h3g-55p8 (nanoid infinite loop when a custom generator gets size 0, via postcss)
  nanoid@<3.3.18: 6.0.2
  # GHSA-w3rx-r6r6-pgpr / GHSA-5p2g-fcmc-qvqq (image-size)
  image-size@<2.0.3: 2.0.4
  # GHSA-2883-xcg3-v3hh (js-yaml 4.x)
  js-yaml@>=4.0.0 <4.3.2: 5.5.0
  # GHSA-w27v-7q3p-w38r / GHSA-4vpr-x523-8j87 (svgo 3.x, via cssnano)
  svgo@>=3.0.0 <3.3.5: 4.1.0
  # GHSA-3wwx-pv8p-q78v (+ more) (undici 7.x)
  undici@<7.29.1: 8.12.3
  # GHSA-2wm5-q62r-hmrv (colord, via cssnano)
  colord@<2.9.4: 2.10.0
  # GHSA-4mjr-xmp4-gh2g / GHSA-x5fp-wj9c-mxmx (qs, via express)
  qs@<6.16.0: 6.17.1
  # body-parser DoS via trailing bytes (CVE-2026-111181, via express)
  body-parser@<1.20.9: 1.20.9
  # compression memory-leak DoS on premature close (GHSA-vc2v-76pw-4v95)
  compression@<1.8.2: 1.8.2
  # follow-redirects sensitive-header leaks on cross-origin redirects
  follow-redirects@<1.16.2: 1.16.2
  # joi quadratic-time email split
  joi@>=17.1.1 <17.13.9: 17.13.9
  # launch-editor command injection / escaping issues
  launch-editor@<2.14.2: 2.14.2
  # postcss-selector-parser quadratic selector parsing
  postcss-selector-parser@<6.1.5: 6.1.5
  postcss-selector-parser@>=7.0.0 <7.1.7: 7.1.7
  # proxy-addr IPv4-mapped IPv6 trust-subnet spoofing
  proxy-addr@<2.0.8: 2.0.8
  # shell-quote quote() command injection via line terminator
  shell-quote@<1.12.0: 1.12.0
  # source-map-js event-loop DoS via indexed source maps
  source-map-js@<1.2.2: 1.2.2
  # tinypool prototype-pollution gadget to RCE (via @docusaurus/core)
  tinypool@<2.1.2: 2.2.0
