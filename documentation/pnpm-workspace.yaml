allowBuilds:
  '@swc/core': true
  core-js: true

# Pin transitive dependency versions to eliminate vulnerable copies pulled in
# by Docusaurus and its plugins.
overrides:
  # GHSA-qj8w-gfj5-8c6v (RCE) + serialize-javascript CPU exhaustion
  serialize-javascript@<7.0.5: 7.1.2
  # GHSA-5jgf-p345-68v8 / GHSA-fph4-wmhf-6fwf / GHSA-f65p-4m7j-42xc / GHSA-jqff-g426-hqxp
  # (fast-uri host confusion + SSRF, on top of GHSA-7p8r-x3mc-p8w7 / GHSA-v2hh-gcrm-f6hx, via ajv)
  fast-uri@<3.1.6: 4.2.1
  # GHSA (uuid missing buffer bounds check in v3/v5/v6)
  uuid@<11.1.1: 11.1.1
  # GHSA-2v37-7h3g-55p8 (nanoid infinite loop when a custom generator gets size 0, via postcss)
  nanoid@<3.3.18: 6.0.1
  # GHSA-w3rx-r6r6-pgpr / GHSA-5p2g-fcmc-qvqq (image-size)
  image-size@<2.0.3: 2.0.4
  # GHSA-2883-xcg3-v3hh (js-yaml 4.x)
  js-yaml@>=4.0.0 <4.3.2: 5.4.2
  # GHSA-w27v-7q3p-w38r / GHSA-4vpr-x523-8j87 (svgo 3.x, via cssnano)
  svgo@>=3.0.0 <3.3.5: 3.3.5
  # GHSA-3wwx-pv8p-q78v (+ more) (undici 7.x)
  undici@<7.29.1: 7.30.0
  # GHSA-2wm5-q62r-hmrv (colord, via cssnano)
  colord@<2.9.4: 2.10.0
  # GHSA-4mjr-xmp4-gh2g / GHSA-x5fp-wj9c-mxmx (qs, via express)
  qs@<6.16.0: 6.16.0
