name: Build Docker Image

on:
  workflow_call:
    outputs:
      server_image_tag:
        description: "The tag of the server image that was built"
        value: ${{ jobs.build-server.outputs.server_image_tag }}
      client_image_tag:
        description: "The tag of the client image that was built"
        value: ${{ jobs.build-client.outputs.client_image_tag }}

permissions:
  contents: read
  packages: write

jobs:
  build-server:
    runs-on: ubuntu-latest
    outputs:
      server_image_tag: "${{ steps.output-tag.outputs.server_image_tag }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 1

      - name: Get changed files in the server folder
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: server/**

      - name: Extract version from build.gradle
        id: version
        run: echo "version=$(grep '^version = ' server/build.gradle | sed 's/version = "\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Check that version is not already released
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.changed-files.outputs.any_changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          HEAD_COMMIT=$(git rev-parse HEAD)
          git fetch --tags --quiet
          TAG_COMMIT=""
          for ref in "refs/tags/${VERSION}" "refs/tags/v${VERSION}"; do
            if git rev-parse -q --verify "${ref}" >/dev/null; then
              TAG_COMMIT=$(git rev-parse "${ref}^{commit}")
              break
            fi
          done
          if [[ -n "${TAG_COMMIT}" && "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]]; then
            echo "::error::Version ${VERSION} has already been released at ${TAG_COMMIT}, but this build is for ${HEAD_COMMIT}. Bump the version using supporting_scripts/update_version.sh before merging."
            exit 1
          fi

      - name: Log in to the Container registry
        if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Docker Buildx
        if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
        uses: docker/setup-buildx-action@v4

      # Generate SBOMs on the runner before the Docker build so they land
      # in the build context and get bundled into the server jar via
      # processResources. They're consumed at runtime by the admin
      # dependency overview and the weekly vulnerability scan. Not tracked
      # in the repo (server/sbom, client/sbom are gitignored).
      - name: Set up JDK 25
        if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Generate server SBOM
        if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
        working-directory: ./server
        run: |
          chmod +x ./gradlew
          ./gradlew cyclonedxBom --no-daemon

      - name: Enable Corepack
        if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
        run: corepack enable

      - name: Set up Node.js
        if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'

      # `pnpm sbom --lockfile-only` reads the lockfile directly, so we
      # deliberately do NOT run `pnpm install` — skipping it saves time
      # and avoids running dependency lifecycle scripts. Corepack provides
      # pnpm. Invoke the generator via `node` (not `pnpm run sbom`) so
      # pnpm doesn't try to verify/install deps or run lifecycle scripts
      # before executing our script.
      - name: Generate client SBOM
        if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
        working-directory: ./client
        run: node scripts/generate-sbom.js

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ls1intum/thesis-management/thesis-management-server
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push Docker Image
        if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./server.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,scope=server-image,mode=max

      - id: output-tag
        run: |
          if [[ "${{ steps.changed-files.outputs.any_changed }}" == "true" ]]; then
            echo "server_image_tag=${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "server_image_tag=latest" >> "$GITHUB_OUTPUT"
          fi

  build-client:
    runs-on: ubuntu-latest
    outputs:
      client_image_tag: "${{ steps.output-tag.outputs.client_image_tag }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 1

      - name: Get changed files in the client folder
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: client/**

      - name: Extract version from package.json
        id: version
        run: echo "version=$(node -p "require('./client/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check that version is not already released
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.changed-files.outputs.any_changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          HEAD_COMMIT=$(git rev-parse HEAD)
          git fetch --tags --quiet
          TAG_COMMIT=""
          for ref in "refs/tags/${VERSION}" "refs/tags/v${VERSION}"; do
            if git rev-parse -q --verify "${ref}" >/dev/null; then
              TAG_COMMIT=$(git rev-parse "${ref}^{commit}")
              break
            fi
          done
          if [[ -n "${TAG_COMMIT}" && "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]]; then
            echo "::error::Version ${VERSION} has already been released at ${TAG_COMMIT}, but this build is for ${HEAD_COMMIT}. Bump the version using supporting_scripts/update_version.sh before merging."
            exit 1
          fi

      - name: Log in to the Container registry
        if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Docker Buildx
        if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ls1intum/thesis-management/thesis-management-client
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push Docker Image
        if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./client.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=client-image
          cache-to: type=gha,scope=client-image,mode=max

      - id: output-tag
        run: |
          if [[ "${{ steps.changed-files.outputs.any_changed }}" == "true" ]]; then
            echo "client_image_tag=${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "client_image_tag=latest" >> "$GITHUB_OUTPUT"
          fi
