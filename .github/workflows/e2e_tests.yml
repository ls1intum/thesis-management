name: E2E Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:${{ vars.POSTGRES_IMAGE_TAG || '18.4-alpine' }}
        env:
          POSTGRES_USER: thesis-management-postgres
          POSTGRES_PASSWORD: thesis-management-postgres
          POSTGRES_DB: thesis-management
        ports:
          - 5444:5432
        options: >-
          --health-cmd "pg_isready -d thesis-management -U thesis-management-postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mailpit:
        image: axllent/mailpit:v1.30.6
        ports:
          - 1125:1025
          - 8125:8025
        options: >-
          --health-cmd "wget -qO- http://localhost:8025/api/v1/messages || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 1

      # Build + start Keycloak from the repo Dockerfile used in local compose.
      - name: Start Keycloak
        run: |
          docker build -t thesis-management-keycloak-ci -f keycloak/Dockerfile .

          docker run -d --name keycloak \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -p 8181:8080 \
            -v "$PWD/keycloak/thesis-management-realm.json:/opt/keycloak/data/import/thesis-management-realm.json:ro" \
            thesis-management-keycloak-ci \
            start-dev --import-realm

      - name: Wait for Keycloak to be ready
        run: |
          echo "Waiting for Keycloak..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8181/realms/thesis-management > /dev/null 2>&1; then
              echo "Keycloak is ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Keycloak failed to start"
              docker logs keycloak
              exit 1
            fi
            sleep 2
          done

      - name: Verify Keycloak passkey provider
        run: |
          echo "Waiting for Keycloak passkey provider..."
          headers_file="$(mktemp)"
          body_file="$(mktemp)"
          for i in $(seq 1 60); do
            status="$(
              curl -sS \
                -D "$headers_file" \
                -o "$body_file" \
                -w "%{http_code}" \
                -H "Origin: http://localhost:3100" \
                http://localhost:8181/realms/thesis-management/passkey/thesis-management-app/health || true
            )"
            if [[ "$status" =~ ^2[0-9][0-9]$ ]] \
              && grep -qi '^access-control-allow-origin: http://localhost:3100' "$headers_file" \
              && grep -qi '^access-control-allow-credentials: true' "$headers_file"; then
              echo "Keycloak passkey provider is ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Keycloak passkey provider did not become available with credentialed CORS for http://localhost:3100"
              echo "Last HTTP status: ${status:-none}"
              echo "Last response headers:"
              cat "$headers_file"
              echo "Last response body:"
              cat "$body_file"
              docker logs keycloak
              exit 1
            fi
            sleep 2
          done

      # Set up Java for server
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./server/gradlew

      # Set up Node.js up front so we can generate the client SBOM before
      # the server starts. The server's `processResources` bundles both
      # SBOMs (server + client) into the jar's classpath, and the admin
      # dependency page's e2e tests rely on both being present. The server
      # SBOM is regenerated automatically by Gradle (via the implicit
      # cyclonedxBom -> processResources dependency); the client SBOM has
      # to be produced explicitly with pnpm.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: 'pnpm'
          cache-dependency-path: client/pnpm-lock.yaml

      # `pnpm sbom --lockfile-only` reads the lockfile directly, so no
      # `pnpm install` is needed here — the client dependency install
      # below still handles workspace setup for the actual client build.
      # Invoke the generator via `node` (not `pnpm run sbom`) so pnpm
      # doesn't try to verify/install deps or run lifecycle scripts
      # before executing our script.
      - name: Generate client SBOM
        working-directory: ./client
        run: node scripts/generate-sbom.js

      # Start server in background with dev profile
      - name: Start server
        working-directory: ./server
        run: ./gradlew bootRun --args='--spring.profiles.active=dev --server.port=8180' &
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5444/thesis-management
          SPRING_DATASOURCE_USERNAME: thesis-management-postgres
          SPRING_DATASOURCE_PASSWORD: thesis-management-postgres
          KEYCLOAK_HOST: http://localhost:8181
          KEYCLOAK_REALM_NAME: thesis-management
          KEYCLOAK_CLIENT_ID: thesis-management-app
          KEYCLOAK_SERVICE_CLIENT_ID: thesis-management-service-client
          KEYCLOAK_SERVICE_CLIENT_SECRET: "**********"
          CLIENT_HOST: http://localhost:3100

      - name: Install client dependencies
        working-directory: ./client
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: ./client
        run: pnpm exec playwright install --with-deps chromium

      # Build the client and serve it as a static bundle. Running production
      # output (instead of webpack-dev-server) avoids the dev-mode error
      # overlay iframe that occasionally intercepts clicks during e2e tests.
      - name: Build client
        working-directory: ./client
        run: pnpm build
        env:
          SERVER_HOST: http://localhost:8180
          # Matches the dev server profile (thesis-management.ai.enabled=true) so the AI
          # feedback buttons render for the ai-feedback.spec.ts e2e coverage.
          AI_FEATURES_ENABLED: "true"
          KEYCLOAK_HOST: http://localhost:8181
          KEYCLOAK_REALM_NAME: thesis-management
          KEYCLOAK_CLIENT_ID: thesis-management-app

      - name: Generate runtime-env.js for the static bundle
        working-directory: ./client/build
        run: node ../public/generate-runtime-env.js
        env:
          SERVER_HOST: http://localhost:8180
          AI_FEATURES_ENABLED: "true"
          KEYCLOAK_HOST: http://localhost:8181
          KEYCLOAK_REALM_NAME: thesis-management
          KEYCLOAK_CLIENT_ID: thesis-management-app

      - name: Serve client static bundle
        working-directory: ./client
        run: pnpm dlx serve@14 -s build -l 3100 -c ../serve.e2e.json --no-clipboard --no-port-switching &

      # Wait for both services to be ready
      - name: Wait for server to be ready
        run: |
          echo "Waiting for Spring Boot server..."
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8180/api/actuator/health > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "Server failed to start"
              exit 1
            fi
            sleep 2
          done

      - name: Wait for client to be ready
        run: |
          echo "Waiting for client static server..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3100 > /dev/null 2>&1; then
              echo "Client is ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Client failed to start"
              exit 1
            fi
            sleep 2
          done

      # Run E2E tests
      - name: Run Playwright tests
        working-directory: ./client
        run: pnpm exec playwright test
        env:
          CI: "1"
          CLIENT_URL: http://localhost:3100
          KEYCLOAK_HOST: http://localhost:8181
          KEYCLOAK_REALM_NAME: thesis-management
          KEYCLOAK_CLIENT_ID: thesis-management-app

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-results
          path: client/test-results/
          retention-days: 14
