logging:
  level:
    liquibase: INFO
    net.fortuna.ical4j.util.Configurator: INFO

spring:
  thymeleaf:
    check-template-location: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5444/thesis-management}
    username: ${SPRING_DATASOURCE_USERNAME:thesis-management-postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:thesis-management-postgres}
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: db/changelog/db.changelog-master.xml
    contexts: ${LIQUIBASE_CONTEXTS:prod}
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate
    show-sql: ${DEBUG_MODE:false}
    properties:
      hibernate:
        format_sql: ${DEBUG_MODE:false}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:thesis-management-app}
            scope: openid
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_HOST:http://localhost:8181}/realms/${KEYCLOAK_REALM_NAME:thesis-management}
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_HOST:http://localhost:8181}/realms/${KEYCLOAK_REALM_NAME:thesis-management}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_HOST:http://localhost:8181}/realms/${KEYCLOAK_REALM_NAME:thesis-management}
  mail:
    host: ${POSTFIX_HOST:localhost}
    port: ${POSTFIX_PORT:25}
    username: ${POSTFIX_USERNAME:}
    password: ${POSTFIX_PASSWORD:}
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}
            required: ${MAIL_STARTTLS_REQUIRED:false}

  ai:
    openai:
      base-url: ${OPENAI_BASE_URL:https://gpu.aet.cit.tum.de/api}
      api-key: ${OPENAI_API_KEY:**********}
      # Whole-request timeout applied to the underlying OpenAI HTTP client. Spring AI defaults to
      # 60s, which is far too short for a full thesis PDF review: the model streams for minutes and
      # the client hangs up mid-generation (the provider logs "client disconnected"), then retries.
      # Note that spring.ai.openai.chat.options.timeout is a deprecated no-op in Spring AI 2.0 —
      # only this property (or spring.ai.openai.chat.timeout) reaches the HTTP client.
      timeout: ${OPENAI_TIMEOUT:10m}
      chat:
        model: ${OPENAI_CHAT_MODEL:google/gemma-4-26B-A4B-it}
        temperature: ${OPENAI_CHAT_TEMPERATURE:1.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    java:
      enabled: true
    git:
      enabled: true
  health:
    mail:
      enabled: ${MAIL_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

thesis-management:
  ai:
    enabled: ${AI_FEATURES_ENABLED:false}
    # Force per-page image rendering on/off. Left blank (unset) so the pipeline auto-detects
    # vision support from the configured chat model; an empty value binds to a null Boolean.
    review-include-images: ${AI_REVIEW_INCLUDE_IMAGES:}
  keycloak:
    host: ${KEYCLOAK_HOST:http://localhost:8181}
    realm-name: ${KEYCLOAK_REALM_NAME:thesis-management}
    service-client:
      id: ${KEYCLOAK_SERVICE_CLIENT_ID:thesis-management-service-client}
      secret: ${KEYCLOAK_SERVICE_CLIENT_SECRET:**********}
  client:
    host: ${CLIENT_HOST:http://localhost:3100}
  mail:
    enabled: ${MAIL_ENABLED:false}
    sender: ${MAIL_SENDER:thesis-dev@test.aet.cit.tum.de}
  data-retention:
    cron: ${DATA_RETENTION_CRON:0 0 4 * * *}
    rejected-application-retention-days: ${REJECTED_APP_RETENTION_DAYS:365}
    inactive-user-days: ${INACTIVE_USER_DAYS:365}
    thesis-anonymization-notification-days: ${THESIS_ANON_NOTIFICATION_DAYS:30}
  data-export:
    path: ${DATA_EXPORT_PATH:data-exports}
    retention-days: ${DATA_EXPORT_RETENTION_DAYS:7}
    days-between-exports: ${DATA_EXPORT_COOLDOWN_DAYS:7}
  storage:
    upload-location: ${UPLOAD_FOLDER:uploads}
  dependency-scan:
    cron: ${VULNERABILITY_SCAN_CRON:0 0 8 * * MON}
    # Recipient of the weekly scan email is the configured mail sender
    # (thesis-management.mail.sender / MAIL_SENDER). The TUM deployment sets MAIL_SENDER
    # to the support address; forks/other chairs setting MAIL_SENDER for their own mail
    # flow automatically get the scan to their own mailbox without any extra config.
    github-repo: ${VULNERABILITY_SCAN_GITHUB_REPO:ls1intum/thesis-management}
    osv-url: ${VULNERABILITY_SCAN_OSV_URL:https://api.osv.dev}
    github-api-url: ${VULNERABILITY_SCAN_GITHUB_API_URL:https://api.github.com}
    test-server: ${TEST_SERVER:false}
