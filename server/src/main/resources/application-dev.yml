server:
  port: 8180

spring:
  liquibase:
    contexts: dev

  mail:
    host: localhost
    port: 1125
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          starttls:
            enable: false
            required: false

  ai:
    openai:
      base-url: http://localhost:1234/v1
      api-key:
      timeout: 10m
      chat:
        model: openai/gpt-oss-120b
        temperature: 1.0

thesis-management:
  ai:
    enabled: true
    review-include-images: false
  mail:
    enabled: true

logging:
  level:
    root: DEBUG
