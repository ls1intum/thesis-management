allowBuilds:
  '@parcel/watcher': true

# Pin transitive dependency versions across the entire dep tree. These
# eliminate older / vulnerable copies that ship as transitive deps of
# webpack, eslint, etc.
overrides:
  ajv: 8.20.0
  minimatch: 10.2.6
  serialize-javascript: 7.0.7
  lodash: 4.18.1
  follow-redirects: 1.16.0
  flatted: 3.4.4
  # GHSA-rgw5-rvv9-x895 (brace-expansion ReDoS via unbounded intermediate)
  brace-expansion: 5.0.9
  yaml: 2.9.0
  uuid: 14.0.2
  picomatch@<4: 2.3.2
  picomatch@>=4: 4.0.7
  fork-ts-checker-webpack-plugin>schema-utils: 4.3.3
  # @tiptap/react pulls its menu extensions in as optionalDependencies with a
  # caret range, but they peer-require an exact @tiptap/core match. Pin them to
  # the family version so the range cannot drift ahead of @tiptap/core.
  '@tiptap/extension-bubble-menu': 3.30.2
  '@tiptap/extension-floating-menu': 3.30.2
  # GHSA-q8mj-m7cp-5q26
  qs@<6.15.2: 6.15.3
  # GHSA-58qx-3vcg-4xpx
  ws@>=8.0.0 <8.20.1: 8.21.3
  # GHSA-w7jw-789q-3m8p (shell-quote newline escaping, via launch-editor)
  shell-quote@<1.8.4: 1.9.0
  # GHSA-v6wh-96g9-6wx3 (launch-editor NTLMv2 hash disclosure, via webpack-dev-server)
  launch-editor@<2.14.1: 2.14.1
  # GHSA-fx2h-pf6j-xcff (vite server.fs.deny bypass, via vitest)
  vite@>=8.0.0 <8.0.16: 8.1.5
  # GHSA-ph9p-34f9-6g65 (tmp path traversal, via patch-package)
  tmp@<0.2.6: 0.2.7
  # GHSA-h67p-54hq-rp68 (js-yaml quadratic-complexity DoS, via cosmiconfig)
  js-yaml@>=4.0.0 <4.2.0: 5.2.3
  # GHSA-4cwx-7wf7-3272 (+ GHSA-vmh5-mc38-953g / GHSA-hm92-r4w5-c3mj +4) (undici cross-user info disclosure / Set-Cookie / cache / SOCKS5, via jsdom)
  undici@<7.29.0: 7.29.0
  # GHSA-64mm-vxmg-q3vj (http-proxy-middleware host+path routing bypass, via webpack-dev-server)
  http-proxy-middleware@<3.0.6: 4.2.0
  # GHSA-2p49-hgcm-8545 (svgo removeScripts leaves executable code, via svg loaders)
  svgo@>=4.0.0 <4.0.2: 4.0.2
  # GHSA-5jgf-p345-68v8 / GHSA-fph4-wmhf-6fwf / GHSA-f65p-4m7j-42xc / GHSA-jqff-g426-hqxp
  # (fast-uri host confusion + SSRF, on top of GHSA-7p8r-x3mc-p8w7 / GHSA-v2hh-gcrm-f6hx, via ajv)
  fast-uri@<3.1.6: 3.1.6
  # GHSA-fxqj-rqcc-2cmp (postcss sourceMappingURL arbitrary read, transitive via vitest>vite)
  postcss@<8.5.23: 8.5.26
